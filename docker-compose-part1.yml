services:
  db:
    image: mysql:8.0
    container_name: guestbook-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: guestbook
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: masharibkhan/guestbook-web:latest
    container_name: guestbook-web
    restart: always
    ports:
      - "8090:5000"
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASS: apppass
      DB_NAME: guestbook
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
